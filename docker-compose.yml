services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: kibo-api:latest
    container_name: kibo-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./apps/api/.env.production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
